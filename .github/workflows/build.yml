name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: VikasAssistant/VikasAssistant

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VikasAssistant-APK
          path: VikasAssistant/VikasAssistant/app/build/outputs/apk/debug/app-debug.apk
